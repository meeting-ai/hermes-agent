description: "Meeting.ai is the AI that works before, during, and after your meeting. Connect it, and Hermes works from what was actually said. Before, Hermes recalls past decisions and open questions and prepares your brief or deck. During, Meeting.ai records your meeting, in person or on Google Meet, Zoom, and Microsoft Teams, from web, mobile, or desktop. After, Hermes turns the meeting into the work you need: meeting notes with decisions, owners, and next steps, a PDF of the minutes, a PowerPoint deck, or a Visual Note. Disclosure — every tool call goes to Meeting.ai's hosted server (mcp.meeting.ai) and acts on the user's Meeting.ai account with their own workspace role; the tool set is served by that server at runtime and is not covered by the pinned sha. Recording, Visual Notes and image and audio generation spend the user's Meeting.ai coins or subscription; generation sends the supplied text to third-party AI providers. The package sends no telemetry, but the Meeting.ai server records each MCP call (tool, outcome, user, workspace and client identifiers) for product analytics; this is part of the hosted service. The notetaker joins live calls as a visible participant, and a share link shows the notes and, by default, the transcript. Sign-in runs the pinned mcp-remote@0.15.2 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth; the sign-in must finish within about 55 seconds. The package marks the server untrusted, so by default Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
