description: "Meeting.ai is the AI that works before, during, and after your meeting. Connect it, and Hermes works from what was actually said. Before, Hermes recalls past decisions and open questions and prepares your brief or deck. During, Meeting.ai records your meeting, in person or on Google Meet, Zoom, and Microsoft Teams, from web, mobile, or desktop. After, Hermes turns the meeting into the work you need: meeting notes with decisions, owners, and next steps, a PDF of the minutes, a PowerPoint deck, or a Visual Note."
